<!-- 뷰티 브랜드 간편 가입 화면의 독립 미리보기 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뷰티 브랜드 가입 | K-MODU 화면 시안</title>
  <meta name="description" content="K-MODU 뷰티 브랜드 간편 가입 화면 시안입니다.">
  <style>
    :root {
      --paper: #f7f7f4;
      --white: #fff;
      --ink: #050505;
      --muted: #6c6c67;
      --line: #d9d9d3;
      --sage: #dde5d5;
      --sage-deep: #a5b39b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #52724c; outline-offset: 3px; }
    .topbar {
      height: 86px;
      padding: 0 clamp(24px, 5.8vw, 94px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(247,247,244,.96);
    }
    .brand img { width: 156px; height: auto; display: block; }
    .topnav { display: flex; align-items: center; gap: 42px; margin-left: 85px; }
    .topnav a { text-decoration: none; font-size: 14px; font-weight: 600; }
    .topnav a.active { font-weight: 800; }
    .header-side { display: flex; align-items: center; gap: 16px; }
    .draft {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .login-link {
      padding: 11px 19px;
      border-radius: 99px;
      background: var(--ink);
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    .shell {
      max-width: 1600px;
      min-height: min(770px, calc(100vh - 86px));
      margin: auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(480px, .95fr);
    }
    .story {
      min-width: 0;
      padding: clamp(46px, 6vw, 95px) clamp(28px, 5.8vw, 94px) 44px;
      display: flex;
      flex-direction: column;
    }
    .section-mark {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .section-mark i { width: 7px; height: 7px; border-radius: 50%; background: #8eaa80; }
    h1 {
      margin: 36px 0 23px;
      max-width: 720px;
      font-size: clamp(48px, 5.5vw, 82px);
      line-height: 1.06;
      letter-spacing: -.075em;
      font-weight: 800;
    }
    .intro {
      max-width: 560px;
      margin: 0;
      color: #33332f;
      font-size: clamp(16px, 1.45vw, 19px);
      line-height: 1.7;
      letter-spacing: -.025em;
    }
    .promise {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 27px 0 0;
      padding: 0;
      list-style: none;
    }
    .promise li {
      padding: 9px 13px;
      border: 1px solid #c9ccc4;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
    }
    .editorial {
      position: relative;
      width: min(100%, 615px);
      height: clamp(190px, 19vw, 272px);
      margin-top: auto;
      overflow: hidden;
      background: #eee8e0;
    }
    .editorial img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }
    .editorial-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      padding: 12px 17px;
      background: var(--paper);
      font-size: 12px;
      font-weight: 700;
    }
    .form-zone {
      padding: clamp(32px, 4.7vw, 72px);
      display: flex;
      align-items: center;
      background: var(--sage);
      border-left: 1px solid #cbd5c5;
    }
    .form-card {
      width: min(100%, 580px);
      margin: auto;
      padding: clamp(26px, 3.3vw, 48px);
      background: var(--white);
      border: 1px solid #c7d0c0;
      box-shadow: 14px 14px 0 rgba(135,157,125,.17);
    }
    .form-overline {
      color: #577151;
      font-size: 12px;
      font-weight: 800;
    }
    h2 {
      margin: 12px 0 8px;
      font-size: clamp(26px, 2.8vw, 37px);
      line-height: 1.17;
      letter-spacing: -.05em;
    }
    .form-description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .google-button {
      width: 100%;
      min-height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #9b9b95;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }
    .google-g { font-weight: 800; font-size: 19px; color: #4285f4; }
    .divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 22px 0 19px;
      color: #777770;
      font-size: 11px;
      white-space: nowrap;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 17px 15px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 800; }
    .field label small { color: var(--muted); font-weight: 500; }
    .field input, .field select {
      width: 100%;
      min-height: 45px;
      padding: 0 12px;
      border: 1px solid #c8c8c2;
      border-radius: 0;
      background: #fff;
      color: var(--ink);
      outline-color: #52724c;
      font-size: 14px;
    }
    .field input::placeholder { color: #a5a5a0; }
    .consent {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 19px 0 18px;
      color: #555550;
      font-size: 11px;
      line-height: 1.5;
    }
    .consent input { margin: 1px 0 0; accent-color: #233320; }
    .submit {
      width: 100%;
      min-height: 54px;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .submit:hover { background: #293429; }
    .form-note { margin: 11px 0 0; text-align: center; color: var(--muted); font-size: 11px; }
    .status { min-height: 20px; margin: 9px 0 0; color: #45613e; font-size: 12px; font-weight: 700; }
    .footer {
      max-width: 1600px;
      margin: auto;
      padding: 19px clamp(24px, 5.8vw, 94px);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    @media (max-width: 1100px) {
      .topnav { display: none; }
      .shell { grid-template-columns: minmax(0, 1fr) minmax(430px, 1fr); }
      .story { padding: 58px 38px 34px; }
      .form-zone { padding: 36px; }
      h1 { font-size: clamp(45px, 5.7vw, 64px); }
    }
    @media (max-width: 780px) {
      .topbar { height: 68px; padding: 0 20px; }
      .brand img { width: 129px; }
      .login-link { display: none; }
      .shell { min-height: 0; display: block; }
      .story { padding: 43px 23px 0; }
      .section-mark { font-size: 11px; }
      h1 { margin: 23px 0 17px; font-size: clamp(46px, 11.5vw, 67px); }
      .intro { font-size: 16px; }
      .promise { margin-top: 21px; }
      .editorial { height: 205px; width: 100%; margin-top: 31px; }
      .form-zone { margin-top: 0; padding: 24px 18px 38px; border: 0; }
      .form-card { padding: 29px 23px; box-shadow: 8px 8px 0 rgba(135,157,125,.17); }
      .footer { padding: 17px 20px; flex-direction: column; gap: 5px; }
    }
    @media (max-width: 440px) {
      .draft { font-size: 10px; }
      .fields { grid-template-columns: 1fr; gap: 14px; }
      .field.full { grid-column: auto; }
      .promise li { font-size: 11px; }
      .editorial { height: 170px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="K-MODU 홈"><img src="../../assets/k-modu-logo.png" alt="K-MODU"></a>
    <nav class="topnav" aria-label="주요 메뉴">
      <a href="#">소개</a><a class="active" href="#">뷰티</a><a href="#">디자이너</a><a href="#">크리에이터</a><a href="#">문의</a>
    </nav>
    <div class="header-side"><span class="draft">화면 시안</span><a class="login-link" href="#join">로그인</a></div>
  </header>
  <main class="shell">
    <section class="story" aria-labelledby="headline">
      <span class="section-mark"><i aria-hidden="true"></i> K-MODU 뷰티 브랜드</span>
      <h1 id="headline">뷰티 브랜드<br>회원가입</h1>
      <p class="intro">브랜드 정보를 입력해 계정을 만들고 상품 등록을 시작하세요.</p>
      <ul class="promise" aria-label="가입 혜택">
        <li>계정 생성</li><li>브랜드 정보</li><li>상품 등록</li>
      </ul>
      <div class="editorial">
        <img src="../../assets/beauty-products/beauty-product-collection-a.webp" alt="K-MODU 뷰티 제품 연출 예시">
        <span class="editorial-caption">K-MODU 뷰티 브랜드</span>
      </div>
    </section>
    <section class="form-zone" id="join" aria-labelledby="form-title">
      <div class="form-card">
        <span class="form-overline">뷰티 브랜드 등록</span>
        <h2 id="form-title">브랜드 정보 입력</h2>
        <p class="form-description">가입에 필요한 정보를 입력해 주세요.</p>
        <button class="google-button" type="button" id="googleDemo"><span class="google-g" aria-hidden="true">G</span> Google 계정으로 시작</button>
        <div class="divider">로그인 후 아래 정보를 입력합니다</div>
        <form id="previewForm">
          <div class="fields">
            <div class="field full"><label for="brandName">브랜드명</label><input id="brandName" placeholder="예: 라벨라쥬" autocomplete="organization" required></div>
            <div class="field"><label for="managerName">담당자명</label><input id="managerName" placeholder="이름을 입력하세요" autocomplete="name" required></div>
            <div class="field"><label for="category">주요 상품 분야</label><select id="category" required><option value="">분야 선택</option><option>스킨케어</option><option>메이크업</option><option>헤어·바디</option><option>기타 뷰티</option></select></div>
            <div class="field full"><label for="email">연락받을 이메일</label><input id="email" type="email" placeholder="brand@example.com" autocomplete="email" required></div>
            <div class="field full"><label for="channel">브랜드 홈페이지 또는 인스타그램 <small>선택</small></label><input id="channel" type="url" placeholder="https://"></div>
          </div>
          <label class="consent"><input type="checkbox" required><span>본인이 해당 브랜드의 상품 정보를 등록할 권한이 있음을 확인합니다.</span></label>
          <button class="submit" type="submit">가입하고 상품 올리기</button>
          <p class="form-note">가입 후 브랜드 센터에서 상품을 등록할 수 있습니다.</p>
          <p class="status" id="previewStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="footer"><span>K-MODU by MARKBRIDGE</span><span>화면 시안입니다. 실제 회원가입은 진행되지 않습니다.</span></footer>
  <script>
    // 화면 시안의 버튼은 실제 로그인이나 회원가입 요청을 보내지 않습니다.
    const status = document.getElementById("previewStatus");
    document.getElementById("googleDemo").addEventListener("click", () => {
      status.textContent = "화면 시안입니다. 실제 구글 로그인은 연결되지 않았습니다.";
    });
    document.getElementById("previewForm").addEventListener("submit", (event) => {
      event.preventDefault();
      status.textContent = "입력 화면을 확인했습니다. 실제 가입은 진행되지 않았습니다.";
    });
  </script>
</body>
</html>
